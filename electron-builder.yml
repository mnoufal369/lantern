appId: nl.noufal.crew
productName: Crew
directories:
  output: release
  buildResources: resources
files:
  - out/**
  - package.json
  - "!node_modules/@anthropic-ai/claude-agent-sdk-linux-*/**"
asar: true
asarUnpack:
  - "node_modules/@anthropic-ai/claude-agent-sdk/**"
  - "node_modules/@anthropic-ai/claude-agent-sdk-darwin-arm64/**"
  - "node_modules/@anthropic-ai/claude-agent-sdk-win32-x64/**"
npmRebuild: false
mac:
  target:
    - target: dmg
      arch:
        - arm64
  category: public.app-category.developer-tools
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
  files:
    - "!node_modules/@anthropic-ai/claude-agent-sdk-win32-*/**"
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: resources/icon.ico
  files:
    - "!node_modules/@anthropic-ai/claude-agent-sdk-darwin-*/**"
nsis:
  oneClick: true
  perMachine: false
  deleteAppDataOnUninstall: false
  artifactName: "Crew-Setup-${version}-x64.${ext}"
dmg:
  title: Crew
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
